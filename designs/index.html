<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Universe — Creative inspiration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var t = localStorage.getItem("formlab_theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scene-bg" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <canvas id="particles"></canvas>
  </div>

  <header class="topbar">
    <a class="logo" href="#/" aria-label="Creative Universe home">
      <span class="logo-mark" aria-hidden="true">C</span>
      <span class="logo-copy">
        <span>Creative <span class="logo-light">Universe</span></span>
        <small>Independent creative index</small>
      </span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Open navigation" aria-controls="mainNav" aria-expanded="false" type="button">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav" id="mainNav" aria-label="Main navigation"></nav>
  </header>

  <main id="app" class="app"></main>

  <footer class="site-footer">
    <p>FormLab showcases website layouts by type, mood, and motion. Simple designs include free source. Other levels need a login.</p>
  </footer>

  <div class="toast" id="toast" hidden></div>
  <dialog class="search-dialog" id="navSearchDialog" aria-labelledby="navSearchTitle">
    <form class="search-dialog-form" id="navSearchForm">
      <label id="navSearchTitle" for="navSearchInput">Search Creative Universe</label>
      <div class="search-field">
        <input id="navSearchInput" type="search" placeholder="Search designs…" autocomplete="off" />
        <button class="search-submit" type="submit">Search</button>
      </div>
      <p>Search currently covers designs available in this library.</p>
      <button class="search-close" id="navSearchClose" type="button">Close</button>
    </form>
  </dialog>

  <script src="js/navigation.js"></script>
  <script src="js/designs-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
